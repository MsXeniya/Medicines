name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server-fastapi/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server-fastapi/requirements.txt
          pip install pytest flake8
      
      - name: Run FastAPI tests
        run: |
          cd server-fastapi
          python -m pytest tests/ -v --tb=short

      - name: Run backend linter (flake8)
        run: |
          echo "Running flake8..."
          flake8 server-fastapi || (echo "Flake8 found issues" && exit 1)

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client-react/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci --prefix client-react

      - name: Run frontend linter (ESLint via npx)
        run: |
          echo "Running ESLint..."
          npx eslint --ext .js,.jsx client-react/src || (echo "ESLint found issues" && exit 1)
      
      - name: Run unit tests
        run: npm run test:unit --prefix client-react
        env:
          CI: true

  build-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        include:
          - service: fastapi
            dockerfile: server-fastapi/Dockerfile
            context: server-fastapi
            image_suffix: fastapi
          
          - service: frontend
            dockerfile: client-react/Dockerfile
            context: client-react
            image_suffix: frontend
          
          - service: backend
            dockerfile: server/Dockerfile
            context: server
            image_suffix: backend
          
          - service: nginx
            dockerfile: nginx/Dockerfile
            context: nginx
            image_suffix: nginx
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
          flavor: |
            suffix=-${{ matrix.image_suffix }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    needs: build-images
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build images locally
        run: |
          docker-compose build
      
      - name: Start services
        run: |
          docker-compose up -d
          sleep 10
      
      - name: Run health checks
        run: |
          docker-compose ps
          docker-compose exec -T nginx wget -q -O- http://localhost/ > /dev/null
          docker-compose exec -T fastapi python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"
      
      - name: Clean up
        if: always()
        run: docker-compose down -v

  deploy:
    needs: integration-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |

